tags:
  - name: Auth
    description: Authentication and Authorization management

components:
  schemas:
    LoginAuthBody:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'nguyenvana@example.com'
        password:
          type: string
          format: password
          example: 'password123'

    RefreshTokenBody:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5c...'

    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5c...'
        refreshToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5c...'

    AuthResponseData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokensResponse'

    SessionDeviceInfo:
      type: object
      properties:
        ipAddress:
          type: string
          example: '192.168.1.1'
        userAgent:
          type: string
          example: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36...'
        browser:
          type: string
          example: 'Chrome'
        os:
          type: string
          example: 'Windows'
        deviceType:
          type: string
          example: 'desktop'

    Session:
      type: object
      properties:
        _id:
          type: string
          example: '6620f1a2b3c4d5e6f7a8b9c0'
        sessionId:
          type: string
          example: 'uuid-session-1234'
        deviceInfo:
          $ref: '#/components/schemas/SessionDeviceInfo'
        isActive:
          type: boolean
          example: true
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    AuthRegisterBody:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: 'Nguyen Van A'
        email:
          type: string
          format: email
          example: 'nguyenvana@example.com'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: At least 8 characters, 1 uppercase letter and 1 number
          example: 'Password123'

    MessageResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
          example: 200
        data:
          type: object
          nullable: true

paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Create a new user account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Account created successfully'
                  status:
                    type: integer
                    example: 201
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '409':
          description: Conflict — Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError' # Shared from user.yml
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login user
      description: Authenticate user and receive access & refresh tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAuthBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login successful'
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/AuthResponseData'
        '401':
          description: Unauthorized — Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout current session
      description: Revoke the current device's session
      tags: [Auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    nullable: true
        '401':
          description: Unauthorized — Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout-all:
    post:
      summary: Logout all sessions
      description: Revoke all active sessions of the user across all devices
      tags: [Auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Logged out from all devices successfully'
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    nullable: true
        '401':
          description: Unauthorized — Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Rotate the token pair. New tokens are set as HttpOnly cookies only, never returned in the body
      tags: [Auth]
      requestBody:
        required: false
        description: The refreshToken cookie is primary; the body is a fallback
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  status:
                    type: integer
                    example: 200
                  data:
                    nullable: true
                    example: null
        '401':
          description: Unauthorized — Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sessions:
    get:
      summary: Get active sessions
      description: Retrieve all active device login sessions for current user
      tags: [Auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Success'
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          description: Unauthorized — Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google:
    get:
      summary: Start Google OAuth
      description: Redirect the browser to the Google consent screen
      tags: [Auth]
      responses:
        '302':
          description: Redirect to Google
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google/callback:
    get:
      summary: Google OAuth callback
      description: >-
        Handled by Passport. On success sets auth cookies and redirects to
        `/?auth=success`; if the email belongs to an existing password account,
        redirects to the account-link page with a pending token; on failure
        redirects to `/login?error=google_failed`.
      tags: [Auth]
      responses:
        '302':
          description: Redirect to the frontend
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google/link:
    post:
      summary: Link Google to an existing account
      description: Confirm the account password to link a pending Google login; sets auth cookies on success
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendingToken, password]
              properties:
                pendingToken:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: OK — account linked, auth cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/AuthResponseData'
        '401':
          description: Unauthorized — invalid pending token or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    get:
      summary: Verify email address
      description: Verify the email from the link sent by email, then redirect to `/login?verified=true`
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the frontend login page
        '400':
          description: Bad request — invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/resend-verification:
    post:
      summary: Resend verification email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: 'nguyenvana@example.com'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      message:
                        example: 'Verification email sent'
        '400':
          description: Bad request — email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      summary: Request password reset OTP
      description: Send a 6-digit OTP to the email if an account exists
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: 'nguyenvana@example.com'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      message:
                        example: 'If the email exists, an OTP has been sent'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      summary: Reset password with OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                  example: 'nguyenvana@example.com'
                otp:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: At least 8 characters, 1 uppercase letter and 1 number
                  example: 'Password123'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      message:
                        example: 'Password reset successfully'
        '400':
          description: Bad request — invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      summary: Change password
      description: Change the password of the authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: At least 8 characters, 1 uppercase letter and 1 number
                  example: 'Password123'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      message:
                        example: 'Password changed successfully'
        '400':
          description: Bad request — no password set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — token invalid or wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/set-password:
    post:
      summary: Set password
      description: Set a password for an account created via Google OAuth
      tags: [Auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: At least 8 characters, 1 uppercase letter and 1 number
                  example: 'Password123'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    properties:
                      message:
                        example: 'Password set successfully'
        '400':
          description: Bad request — password already set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
